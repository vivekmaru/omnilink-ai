<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OmniLink AI Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #151413; color: #f7f6f3; padding: 16px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #f08866; }
    .brand svg { color: #d97757; }

    .quick-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-save-tab { flex: 1; background: #d97757; color: #fff; border: none; border-radius: 8px; padding: 9px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s; }
    .btn-save-tab:hover { background: #c66a4d; }
    .btn-open-app { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #d1cfc7; border-radius: 8px; padding: 9px 12px; font-size: 12px; cursor: pointer; text-decoration: none; display: flex; align-items: center; justify-content: center; }
    .btn-open-app:hover { color: #fff; border-color: rgba(255,255,255,0.2); }

    .search-box { margin-top: 12px; position: relative; }
    .search-input { width: 100%; background: #22201e; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 9px 12px 9px 32px; color: #f7f6f3; font-size: 12px; outline: none; transition: border-color 0.15s; }
    .search-input:focus { border-color: #d97757; }
    .search-icon { position: absolute; left: 10px; top: 10px; color: #9c9a95; }

    .list-header { margin-top: 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-family: monospace; color: #9c9a95; text-transform: uppercase; letter-spacing: 0.5px; }

    .links-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .link-item { background: #22201e; border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 5px; transition: border-color 0.15s; }
    .link-item:hover { border-color: rgba(217, 119, 87, 0.4); }
    .link-title { font-size: 13px; font-weight: 600; color: #f7f6f3; text-decoration: none; line-height: 1.3; }
    .link-title:hover { color: #f08866; }
    .link-meta { display: flex; align-items: center; gap: 6px; font-size: 10px; font-family: monospace; color: #9c9a95; }
    .tag-chip { background: rgba(255,255,255,0.05); padding: 1px 5px; border-radius: 3px; color: #d1cfc7; }

    .status-toast { display: none; padding: 8px; border-radius: 6px; font-size: 11px; text-align: center; margin-top: 8px; }
    .status-toast.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; }
    .status-toast.error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }

    .empty-state { text-align: center; padding: 30px 10px; color: #9c9a95; font-size: 12px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
      </svg>
      OmniLink Companion
    </div>
  </div>

  <div class="quick-actions">
    <button id="saveCurrentTabBtn" class="btn-save-tab">
      <span>+ Save Current Tab</span>
    </button>
    <a id="openAppBtn" href="http://localhost:3000" target="_blank" class="btn-open-app">
      <span>Open App ↗</span>
    </a>
  </div>

  <div id="statusToast" class="status-toast"></div>

  <div class="search-box">
    <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
    <input type="text" id="searchInput" class="search-input" placeholder="Search with Hybrid AI (FTS5 + Vectors)...">
  </div>

  <div class="list-header">
    <span id="listTitle">Recent Bookmarks</span>
    <span id="itemCount">Loading...</span>
  </div>

  <div class="links-list" id="linksList">
    <div class="empty-state">Loading repository...</div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
